# Builds the web app on every push to main and publishes ONLY the built site
# (web-build/ + web.config) to the `iis-deploy` branch. Plesk pulls that
# branch into httpdocs (see docs/DEPLOY.md §3). Render keeps deploying main.
name: Publish IIS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-iis
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build for IIS
        run: npm run build:iis

      - name: Check the bundle has the tenant config
        run: |
          test -f web-build/index.html
          test -f web-build/web.config
          grep -q "cee20abc" web-build/_expo/static/js/web/*.js

      - name: Publish to iis-deploy
        working-directory: web-build
        run: |
          git init -q -b iis-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "IIS build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" iis-deploy
